name: ci

on:
  push:
    branches: [main]
    paths: &source_paths
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'crates/legal-grammar/src/**'
      - 'crates/legal-grammar/data/**'
      - 'crates/legal-grammar/tests/**'
      - 'crates/legal-grammar/Cargo.toml'
      - 'crates/legal-grammar/build.rs'
      - 'crates/legal-citations/src/**'
      - 'crates/legal-citations/registry/**'
      - 'crates/legal-citations/vendor/**'
      - 'crates/legal-citations/tests/**'
      - 'crates/legal-citations/Cargo.toml'
      - 'crates/legal-citations/build.rs'
      - 'crates/legal-citations-cli/src/**'
      - 'crates/legal-citations-cli/tests/**'
      - 'crates/legal-citations-cli/Cargo.toml'
      - 'conformance/cases/**'
      - 'conformance/schema/**'
      - 'upstream.lock'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    paths: *source_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  rust:
    name: Engine and CLI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Grammar, engine and API conformance
        run: cargo test --locked -p legal-grammar -p legal-citations -p legal-citations-cli
      - name: CLI transport smoke
        run: |
          echo 'R v Jordan, 2016 SCC 27 at para 5' | cargo run --locked -q -p legal-citations-cli -- extract --pretty
          echo 'R v Jordan, 2016 SCC 27' | cargo run --locked -q -p legal-citations-cli -- key
          echo '{"id":1,"method":"version"}' | cargo run --locked -q -p legal-citations-cli -- batch
  registry:
    name: Registry is in sync with upstream.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sync-upstream.py --check
