[package]
name = "legal-citations"
description = "Deterministic legal citation extraction, resolution and formatting for Canadian, Commonwealth and US law"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "registry/**", "vendor/**", "build.rs", "build_registry.rs", "Cargo.toml", "LICENSE", "NOTICE"]

[build-dependencies]
legal-grammar.workspace = true
serde_json.workspace = true
flate2 = "1"
unicode-normalization.workspace = true

[dependencies]
flate2 = "1"
legal-text.workspace = true
legal-grammar.workspace = true
fancy-regex.workspace = true
regex.workspace = true
aho-corasick = "1"
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
unicode-casefold = "0.2"
num-bigint = "0.4"
url = "2.5.8"
# 0.5.1 with only the missing WASI chrono dependency declaration corrected.
diff-match-patch-rs = { path = "vendor/diff-match-patch-rs", version = "0.5.1" }
roxmltree = "0.21"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
scraper = { version = "0.27", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[features]
default =["canada", "uk", "us", "australia", "new-zealand", "ireland", "hong-kong", "singapore", "south-africa"]
# Each jurisdiction's grammar, data and publishers.
canada = []
uk = []
australia = []
new-zealand = []
ireland = []
hong-kong = []
singapore = []
south-africa = []
# US reporters, journals and laws (legal-grammar's eyecite/reporters-db extractors) and CourtListener.
us = ["legal-grammar/us"]
binding-types = ["dep:ts-rs"]
# The alias evidence collector (src/bin/alias_evidence.rs), which reads the A2AJ and journal stores.
alias-evidence = ["dep:rusqlite"]

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["binding-types"]

[[bin]]
name = "alias-evidence"
path = "src/bin/alias_evidence.rs"
required-features = ["alias-evidence"]

[[bin]]
name = "alias-inventory"
path = "src/bin/alias_inventory.rs"
required-features = ["alias-evidence"]
