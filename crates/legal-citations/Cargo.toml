[package]
name = "legal-citations"
description = "Deterministic legal citation extraction, resolution and formatting for Canadian, Commonwealth and US law"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "registry/**", "build.rs", "Cargo.toml", "LICENSE", "NOTICE"]

[build-dependencies]
serde_json.workspace = true

[dependencies]
legal-grammar.workspace = true
regex.workspace = true
aho-corasick = "1"
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
unicode-casefold = "0.2"
num-bigint = "0.4"
url = "2.5.8"
# 0.5.1 with only the missing WASI chrono dependency declaration corrected.
diff-match-patch-rs = { git = "https://github.com/eliziff/diff-match-patch-rs.git", rev = "30daa5ab7e4fac48fcb520641e537c89e6fdc40c" }
roxmltree = "0.21"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
scraper = { version = "0.27", default-features = false }

[features]
binding-types = ["dep:ts-rs"]

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["binding-types"]
