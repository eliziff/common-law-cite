[package]
name = "legal-citations-py"
description = "Python bindings for legal-citations (PyPI package `legal-citations`, module `legal_citations`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "legal_citations_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
legal-citations.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[features]
# maturin enables this when building the wheel (see pyproject.toml).
extension-module = ["pyo3/extension-module"]
