[package]
name = "legal-citations-wasm"
description = "WebAssembly bindings for legal-citations (npm package `legal-citations`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
legal-citations.workspace = true
# Must equal the wasm-bindgen-cli version used by build.sh and CI.
wasm-bindgen = "=0.2.129"
