[package]
name = "legal-grammar"
description = "The shared legal citation, pinpoint, reference and provision grammar corpus with its test vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "data/**", "build.rs", "Cargo.toml", "LICENSE", "NOTICE"]

[features]
default = ["us"]
# The US reporter, journal and law extractors (eyecite/reporters-db snapshot).
us = []

[build-dependencies]
flate2 = "1"
serde_json.workspace = true

[dependencies]
flate2 = "1"
fancy-regex.workspace = true
regex-syntax = "0.8"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
