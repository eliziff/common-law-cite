[workspace]
members = ["crates/*"]
default-members = ["crates/legal-grammar", "crates/legal-citations"]
exclude = ["crates/legal-citations/vendor/diff-match-patch-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0 AND BSD-2-Clause"
repository = "https://github.com/eliziff/common-law-cite"
rust-version = "1.85"

[workspace.dependencies]
legal-grammar = { path = "crates/legal-grammar", version = "0.1.0", default-features = false }
legal-citations = { path = "crates/legal-citations", version = "0.1.0" }
legal-text = { path = "crates/legal-text", version = "0.1.0" }
fancy-regex = "0.19"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-normalization = "0.1"

# Tests and debug builds compile the grammar's patterns and parse the registry: the regex and JSON crates and the
# build scripts run optimized there too.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 16
strip = true
