[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eliziff/legal-citations"
rust-version = "1.80"

[workspace.dependencies]
legal-grammar = { path = "crates/legal-grammar", version = "0.1.0" }
legal-citations = { path = "crates/legal-citations", version = "0.1.0" }
fancy-regex = "0.19"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-normalization = "0.1"

[profile.release]
codegen-units = 16
strip = true
